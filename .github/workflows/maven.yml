name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on:
      group: public-ci
      labels: [site-dedicatednodes, os-linux, arch-x64]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: loyalty_card
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 127.0.0.1::5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build with Maven
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: ./mvnw clean verify
